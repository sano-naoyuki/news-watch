name: fetch-prices

on:
  schedule:
    # 07:15 JST 月〜金（UTC 22:15 日〜木）。routine（08:00 JST）より前に走らせる
    - cron: "15 22 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_prices.py

      - name: Commit data
        run: |
          git config user.name "news-watch-bot"
          git config user.email "news-watch-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "prices: $(date -u +%Y-%m-%d)"
            git push
          fi
